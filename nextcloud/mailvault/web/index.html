<div id="app">
  <div id="title"><span class="name">MailVault</span><span class="doc" id="doctitle">Mail viewer</span>
    <input id="search" placeholder="Search" aria-label="Search mail"></div>
  <div id="tabs"></div>
  <div id="ribbon"></div>
  <div id="jobs"></div>
  <div id="main">
    <nav id="folders" aria-label="Folders"><div id="tree"></div><div id="modnav"></div></nav>
    <div class="split" data-v="--fw"></div>
    <section id="list">
      <div id="listhead">
        <div class="flt"><button data-f="" class="on">All</button><button data-f="unread">Unread</button><button id="statebtn">Filter ▾</button><button id="catbtn" hidden>Category ▾</button></div>
        <button class="sort" id="sortbtn">By Date ▾</button>
      </div>
      <div id="rows" tabindex="0"></div>
    </section>
    <div class="split" data-v="--lw"></div>
    <section id="read"><div class="empty"><svg class="i" style="width:64px;height:64px;stroke-width:1;color:#bbb"><use href="#i-mail"/></svg><p>Select an item to read</p></div></section>
  </div>
  <div id="status"><span id="st-items">No mailbox open</span><span id="st-sel"></span><span class="r" id="st-right">All folders are up to date.</span></div>
</div>
<input type="file" id="filepick" multiple hidden accept=".pst,.ost,.msg,.eml,.emlx,.mbox,.mbx,.zip,.tar,.gz,.tgz,.7z,.rar,.bz2,.xz">
<script src="static/app.js"></script>

</html>
